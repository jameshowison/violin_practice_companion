name: musicxml_tools
description: >-
  MusicXML in pure Dart: a parser into a simple single-line note model, a bar
  editor, repairs for noisy recognized (OMR) scores, injectors and generators,
  ABC export and Jianpu digits.
version: 0.2.0
publish_to: none  # not yet; see docs/family/libraries.md, "Decisions"

environment:
  sdk: ^3.6.0  # pub workspaces need 3.6

resolution: workspace  # resolved with the app; see the root pubspec.yaml

dependencies:
  meta: ^1.15.0
  xml: ^7.0.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
