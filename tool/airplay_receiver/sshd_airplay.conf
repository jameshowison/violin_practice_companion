# Installed by setup_receiver.sh as /etc/ssh/sshd_config.d/zz-airplay.conf.
# The agent's user: key only, from a root-owned key file, one command, nothing else.
# setup_receiver.sh checks with `sshd -T` that this changes nothing for other users.
Match User airplay
    AuthorizedKeysFile /etc/ssh/authorized_keys/%u
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    ForceCommand /usr/local/bin/airplay-ctl
    PermitTTY no
    PermitUserRC no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
