// Installed by tool/airplay_receiver/setup_receiver.sh (marker: airplay_receiver).
// Plays into a FIFO that airplay_capture.py drains and, on request, records.
general = {
  name = "@NAME@";
  output_backend = "pipe";
};

pipe = {
  name = "/var/lib/airplay-fifo/audio.fifo";   // S16_LE, 44100 Hz, stereo
};

diagnostics = {
  log_verbosity = 1;    // connections and stream SETUPs; `receiver.sh logs`
};
